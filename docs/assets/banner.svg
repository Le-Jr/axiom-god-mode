<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AXIOM: infinite god-mode bullet hell">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2FEFF" stop-opacity="1"/>
      <stop offset="18%" stop-color="#5CF2FF" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#5CF2FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CF2FF"/>
      <stop offset="50%" stop-color="#F2FEFF"/>
      <stop offset="100%" stop-color="#9B6BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- enemy bullets: warm, scattered -->
  <g fill="#FF5A2E" filter="url(#glow)" opacity="0.9">
    <circle cx="120" cy="80" r="4"/><circle cx="170" cy="120" r="3"/><circle cx="210" cy="60" r="4"/>
    <circle cx="1040" cy="90" r="4"/><circle cx="1090" cy="140" r="3"/><circle cx="1000" cy="250" r="4"/>
    <circle cx="140" cy="270" r="3"/><circle cx="240" cy="300" r="4"/><circle cx="1120" cy="290" r="3"/>
    <circle cx="300" cy="40" r="3"/><circle cx="920" cy="40" r="3"/><circle cx="960" cy="310" r="3"/>
  </g>
  <g fill="#FFD2A8" opacity="0.95">
    <circle cx="120" cy="80" r="1.5"/><circle cx="210" cy="60" r="1.5"/><circle cx="1040" cy="90" r="1.5"/>
    <circle cx="1000" cy="250" r="1.5"/><circle cx="240" cy="300" r="1.5"/>
  </g>

  <!-- the Unbound: core + atomic orbits, abstract, no emblem -->
  <g transform="translate(600 150)">
    <circle r="150" fill="url(#core)"/>
    <g fill="none" stroke="#5CF2FF" stroke-width="1.4" opacity="0.55" filter="url(#glow)">
      <ellipse rx="120" ry="34"/>
      <ellipse rx="120" ry="34" transform="rotate(60)"/>
      <ellipse rx="120" ry="34" transform="rotate(-60)"/>
    </g>
    <circle r="78" fill="none" stroke="#9B6BFF" stroke-width="1" stroke-dasharray="2 10" opacity="0.6"/>
    <circle r="12" fill="#F2FEFF" filter="url(#glow)"/>
  </g>

  <!-- erasure beam -->
  <line x1="600" y1="150" x2="1180" y2="20" stroke="#F2FEFF" stroke-width="3" filter="url(#glow)" opacity="0.85"/>
  <line x1="600" y1="150" x2="1180" y2="20" stroke="#5CF2FF" stroke-width="9" opacity="0.25"/>

  <text x="600" y="300" text-anchor="middle" font-family="'Unbounded','Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="78" letter-spacing="28" fill="url(#title)" filter="url(#glow)">AXIOM</text>
  <text x="600" y="338" text-anchor="middle" font-family="'Chakra Petch','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" letter-spacing="6" fill="#8FA3B8">the world answers. forever.</text>
</svg>
